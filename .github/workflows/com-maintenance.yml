name: CASTABOT COM-S Maintenance

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/com-maintenance.yml'

permissions:
  contents: read

concurrency:
  group: castabot-com-s-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Verify API secret
        env:
          CASTABOT_API_KEY: ${{ secrets.CASTABOT_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CASTABOT_API_KEY"

      - name: Verify CASTABOT health
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4 5 6; do
            health="$(curl --fail-with-body --silent --show-error 'https://castabot-mcp.onrender.com/healthz' || true)"
            if echo "$health" | jq -e '.ok == true and .version == "1.5.12" and .data_backend_configured == true' >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1

      - name: Process COM-S maintenance cycle
        env:
          CASTABOT_API_KEY: ${{ secrets.CASTABOT_API_KEY }}
        run: |
          set -euo pipefail
          response="$(
            curl --fail-with-body --silent --show-error \
              -X POST 'https://castabot-mcp.onrender.com/procesar-com' \
              -H "Authorization: Bearer $CASTABOT_API_KEY" \
              -H 'Content-Type: application/json' \
              -d '{}'
          )"
          echo "$response"
          echo "$response" | jq -e '.ok == true' >/dev/null

# validation-pulse
