name: COM Fast Path

on:
  push:
    branches:
      - main
    paths:
      - 'com-trigger/**'

permissions:
  contents: read

jobs:
  procesar-com:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Validate secret
        env:
          CASTABOT_API_KEY: ${{ secrets.CASTABOT_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CASTABOT_API_KEY"

      - name: Trigger COM processor
        env:
          CASTABOT_API_KEY: ${{ secrets.CASTABOT_API_KEY }}
        run: |
          set -euo pipefail

          response="$(
            curl --fail-with-body --silent --show-error \
              -X POST 'https://castabot-mcp.onrender.com/procesar-com' \
              -H "Authorization: Bearer $CASTABOT_API_KEY" \
              -H 'Content-Type: application/json' \
              -d '{}'
          )"

          echo "$response"

          echo "$response" | jq -e '.ok == true' >/dev/null
