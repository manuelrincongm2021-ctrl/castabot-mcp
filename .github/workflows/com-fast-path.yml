name: COM Fast Path

on:
  push:
    branches:
      - main
    paths:
      - 'com-trigger/**'

permissions:
  contents: read

jobs:
  procesar-com:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Verify CASTABOT health
        run: |
          set -euo pipefail
          ok=0
          for i in 1 2 3 4 5 6; do
            health="$(curl --fail-with-body --silent --show-error 'https://castabot-mcp.onrender.com/healthz')"
            echo "$health"
            if echo "$health" | jq -e '.ok == true and .version == "1.5.5" and .data_backend_configured == true' >/dev/null; then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" -eq 1

      - name: Validate secret
        env:
          CASTABOT_API_KEY: ${{ secrets.CASTABOT_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$CASTABOT_API_KEY"

      - name: Verify encapsulated data read
        env:
          CASTABOT_API_KEY: ${{ secrets.CASTABOT_API_KEY }}
        run: |
          set -euo pipefail
          response="$(
            curl --fail-with-body --silent --show-error               -X POST 'https://castabot-mcp.onrender.com/consultar-datos'               -H "Authorization: Bearer $CASTABOT_API_KEY"               -H 'Content-Type: application/json'               -d '{"dataset":"PENSION","range":"FORPEN!A1:E3"}'
          )"
          echo "$response" | jq -e '.ok == true and .dataset == "PENSION" and (.rows | length) == 3' >/dev/null
          echo '{"ok":true,"estado":"LECTURA_DATOS_VERIFICADA","dataset":"PENSION","rows":3}'

      - name: Trigger COM processor
        env:
          CASTABOT_API_KEY: ${{ secrets.CASTABOT_API_KEY }}
        run: |
          set -euo pipefail
          response="$(
            curl --fail-with-body --silent --show-error               -X POST 'https://castabot-mcp.onrender.com/procesar-com'               -H "Authorization: Bearer $CASTABOT_API_KEY"               -H 'Content-Type: application/json'               -d '{}'
          )"
          echo "$response"
          echo "$response" | jq -e '.ok == true' >/dev/null
