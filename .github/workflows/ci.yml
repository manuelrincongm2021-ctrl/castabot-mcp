name: CASTABOT MCP CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, reengineering-v1-contracts-2026-10-06]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install

      - name: TypeScript check
        run: npm run check

      - name: Apps Script syntax check
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check < "$file"
          done < <(find apps-script -name '*.gs' -print0)

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
